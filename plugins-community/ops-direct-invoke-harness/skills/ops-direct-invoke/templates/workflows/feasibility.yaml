# 路线有关键疑点时先独立穿刺；PM 下发前具体化范围和 Skill 清单，退出后再编排正式开发。
workflow: ops-direct-invoke
max_parallel: 1
nodes:
- id: '0'
  yaml: ../../tasks/技术穿刺.yaml
  depends_on: []
  max_retries: 3
  variables:
    spike_scope: 在已确认需求的芯片、架构和精度约束下，用最小代表 shape 验证待开发算子的关键端到端组合；覆盖原始任务中列出的技术疑点，记录未验证范围。不改变已确认的单 Kernel 或数据驻留要求。
    executor_skills: 无补充 Skill。
    verifier_skills: 无补充 Skill。
