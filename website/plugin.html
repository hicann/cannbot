<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CANNBot 插件安装与使用文档。" />
    <title>CANNBot 插件文档</title>
    <link rel="icon" type="image/svg+xml" href="./assets/brand/cannbot-favicon.svg?v=4" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="docs-page">
    <header class="docs-header">
      <a class="brand" href="./" aria-label="返回 CANNBot 首页">
        <img class="brand-image" src="./assets/brand/cannbot-wordmark.png" alt="CANNBot" />
      </a>
      <div class="docs-header-actions">
        <label class="search-box"><span>⌕</span><input type="search" placeholder="搜索文档..." aria-label="搜索文档" /><kbd>⌘ K</kbd></label>
        <a href="https://gitcode.com/cann/cannbot" target="_blank" rel="noreferrer">GitCode</a>
        <button class="theme-button" aria-label="切换主题">☼</button>
      </div>
    </header>

    <button class="mobile-menu" id="mobile-menu" aria-label="打开目录">☰</button>
    <aside class="docs-sidebar" id="docs-sidebar">
      <div class="sidebar-label">算子领域</div>
      <a data-plugin-link="ops-direct-invoke" href="./plugin.html?id=ops-direct-invoke">算子生成</a>
      <a data-plugin-link="ascendc-st-design" href="./plugin.html?id=ascendc-st-design">算子测试</a>
      <div class="sidebar-label">模型领域</div>
      <a data-plugin-link="model-infer-optimize" href="./plugin.html?id=model-infer-optimize">模型迁移与推理优化</a>
    </aside>

    <main class="docs-main">
      <article class="docs-article">
        <div class="breadcrumbs"><a href="./">插件门户</a><span>›</span><span id="breadcrumb-domain">算子领域</span><span>›</span><strong id="breadcrumb-title">算子生成</strong></div>
        <div class="article-title-row">
          <div><p class="article-kicker" id="article-domain">算子领域</p><h1 id="article-title">算子生成</h1></div>
        </div>
        <p class="article-lede" id="article-lede"></p>
        <div class="info-callout">
          <span class="info-callout-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20"><path d="M10 1.5c.55 4.75 3.75 7.95 8.5 8.5-4.75.55-7.95 3.75-8.5 8.5-.55-4.75-3.75-7.95-8.5-8.5 4.75-.55 7.95-3.75 8.5-8.5Z"/></svg>
          </span>
          <p id="article-callout"></p>
        </div>

        <section id="step-install" class="doc-section">
          <h2>Step 1：一键安装</h2>
          <p>在目标项目根目录执行。选择 Agent 客户端，复制生成的命令即可。</p>
          <div class="install-panel">
            <div class="tool-tabs" role="tablist" aria-label="客户端">
              <button class="active" data-doc-tool="opencode">OpenCode</button>
              <button data-doc-tool="codex">Codex</button>
              <button data-doc-tool="claude">Claude Code</button>
              <button data-doc-tool="trae">TRAE</button>
              <button data-doc-tool="dsh">DSH</button>
            </div>
            <div class="code-block large-code">
              <div class="code-label"><span>Terminal</span><button data-copy-target="install-command">复制</button></div>
              <pre><code id="install-command"></code></pre>
            </div>
            <p class="install-note" id="install-note"></p>
          </div>
        </section>

        <section id="step-launch" class="doc-section step-section">
          <div class="step-number">2</div>
          <div class="step-content">
            <h2>启动 Agent 客户端</h2>
            <p>安装完成后，在当前项目根目录启动客户端。以 OpenCode 为例：</p>
            <div class="code-block"><div class="code-label"><span>Terminal</span><button data-copy-target="launch-command">复制</button></div><pre><code id="launch-command">opencode</code></pre></div>
          </div>
        </section>

        <section id="step-prompt" class="doc-section step-section">
          <div class="step-number">3</div>
          <div class="step-content">
            <h2>输入提示词</h2>
            <p>直接描述目标和约束，CANNBot 会加载对应工作流并按步骤推进。</p>
            <div class="prompt-card"><div class="prompt-card-head"><span>提示词样例</span><button data-copy-target="prompt-example">复制</button></div><p id="prompt-example"></p></div>
          </div>
        </section>

        <div class="next-card">
          <span>接下来</span>
          <a id="next-plugin" href="./plugin.html?id=ascendc-st-design"><strong id="next-title">算子测试</strong><span>→</span></a>
        </div>
      </article>

      <aside class="page-toc">
        <strong>本页内容</strong>
        <a href="#step-install">一键安装</a>
        <a href="#step-launch">启动客户端</a>
        <a href="#step-prompt">提示词样例</a>
      </aside>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite">内容已复制</div>
    <script src="./app.js"></script>
  </body>
</html>
