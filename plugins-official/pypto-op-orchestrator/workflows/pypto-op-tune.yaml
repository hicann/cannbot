# PyPTO 算子调优工作流（仅调优流程）.
# 独立调优在算子副本中核验 Stage 6 检查点，再进入两个入口共用的 Stage 7 子图。

workflow: pypto-op-tune

max_parallel: 1

max_rollbacks: 0

system_prompt: |-
  这是 PyPTO 算子调优工作流: 对已完成开发与 E2E 验证的算子执行 Stage 7 性能调优。
  并行约束: max_parallel=1, 任何时刻只有一个任务在飞, 不与其他任务共享设备。
  设备号以 $USER_PROMPT 与 $WORK_DIR/prepared_case.json 的 device_id 为唯一权威;
  所有需要 NPU 的 bash 调用必须先 export TILE_FWK_DEVICE_ID=<device_id>, 禁止 find-free/换卡。
  pypto 技能位于 $WORK_DIR/.agents/skills/pypto-*/(SKILL.md 入口); 阶段状态只能通过
  state_transition 工具(hooks 提供)写 custom/<op>/.orchestrator_state.json, 禁止手写该文件。
  约定: 下文 $OP_DIR 指 $WORK_DIR/prepared_case.json 的 op_dir 字段值, $OP 为其 op 字段值。
  调用插件脚本前，读取 $WORK_DIR/.workflow/status.json 的 workflow 路径，将顶层 YAML 同目录下的 scripts 设为 $SCRIPTS。

nodes:
  - id: tune-preflight
    task_type: normal
    title: 调优前置校验 (环境/装配 + impl/test/精度证据 + 最小 MEMORY.md)
    goal:
      - "pypto 资产与环境就绪 (装配幂等; 合并 develop 工作流 preflight-env 的环境校验职责)"
      - "算子实现与测试文件存在且非空，Stage 6 已验收。"
      - "$OP_DIR/MEMORY.md 存在 (缺失时按模板生成最小占位); $WORK_DIR/prepared_case.json 存在 (缺失时从 $USER_PROMPT 合成 tune-only 记录)"
    approach:
      - "从 $USER_PROMPT 解析: 算子产物目录 op_dir（必填，使用本工作区 custom/ 下的算子；外部绝对路径作为只读来源，将产物复制到本工作区后操作）、device id (可选, 缺省为 null, 后续按 TILE_FWK_DEVICE_ID 环境变量或默认设备执行)、性能目标 us (可选, 缺省无硬性目标) 与调优轮次 (可选, 默认 3)。对提示词格式不作要求, 由本节点 agent 按语义解析。新任务显式要求使用 PANKO 时登记 tuning_mode=panko，缺省 stepwise。同一任务续跑沿用本次已登记的策略。"
      - "装配与环境: 若 $USER_PROMPT 指定 cannbot 仓路径或设置了 CANNBOT_ROOT, 运行 python3 $SCRIPTS/assemble_workspace.py --cannbot-root <仓根> --target $WORK_DIR; 否则运行 python3 $SCRIPTS/assemble_workspace.py --target $WORK_DIR (verify-only, 要求此前已装配)。source CANN set_env 后 python3 -c \"import pypto\" 确认可用, npu-smi info 确认 device 可见 (若指定了 device id)。"
      - "prepared_case.json: 若 $WORK_DIR/prepared_case.json 缺失, 手写合成 {\"op\": <op>, \"op_dir\": <op_dir>, \"require\": null, \"task_desc\": null, \"gen_prompt\": null, \"device_id\": <N>, \"perf_target_us\": <F|null>, \"tune_rounds\": <I>, \"tuning_mode\": <策略>, \"mode\": ...}; mode 取值: <op_dir> 内存在 task_desc.py 时为 \"staged\", 否则为 \"interactive\"。从本次请求登记算子目录、设备、策略、目标和预算；已有记录中的相对路径按本工作区解析，显式参数以本次请求为准。"
      - "核对 $OP_DIR/<op>_impl.py 和 $OP_DIR/test_<op>.py 存在且非空。"
      - "MEMORY.md: <op_dir>/MEMORY.md 缺失或为空时, 按 $WORK_DIR/.agents/skills/pypto-memory-template 的模板生成最小占位 (task summary + Performance target sheet 骨架 + 空的 Development & debug log), 不伪造历史记录 (与调用方的最小 MEMORY.md 占位语义一致)。"
      - "将导入副本中上一任务留下的 optimization 目录、<op>_tuning_report.md 和 <op>_tune_result.json 归档到 $WORK_DIR/tuning-history/ 的新子目录。读取副本的阶段状态。若 Stage 7 为 completed 或 failed，调用 state_transition(action=rollback_to_stage, target_stage=6, opDir=$OP_DIR, reason=新任务重新验收导入实现)。"
      - "读取最新的 stage_status。Stage 6 为 completed 时沿用检查点。为 pending 或 failed 且 Stage 5 已完成时，调用 state_transition(action=start_stage, stage=6, opDir=$OP_DIR)。"
      - "Stage 6 为 in_progress 时（包括回滚后中断的任务），在 $OP_DIR 使用本次设备执行 python3 test_<op>.py，并运行 pypto-op-verify 的布局检查。测试退出码为 0、所有输出逐叶 all_close 且布局检查通过后，调用 state_transition(action=complete_stage, stage=6, opDir=$OP_DIR)。失败时保留诊断并退出预检。"
      - "运行 python3 \"$SCRIPTS/select_tuning_workflow.py\" --prepared \"$WORK_DIR/prepared_case.json\"，根据本次已登记策略固定 Stage 7 子图。"
    acceptance:
      - "python3 \"$SCRIPTS/select_tuning_workflow.py\" --prepared \"$WORK_DIR/prepared_case.json\" --check 退出码为 0，所选子图与请求和登记策略一致。"
      - "核对请求的调优策略和 prepared_case.json 的 tuning_mode 一致；旧记录缺省 stepwise。"
      - "test -s $OP_DIR/<op>_impl.py 且 test -s $OP_DIR/test_<op>.py (op/op_dir 来自 $WORK_DIR/prepared_case.json)"
      - "test -f $OP_DIR/MEMORY.md 且 test -s $WORK_DIR/prepared_case.json"
      - "python3 $SCRIPTS/check_artifacts.py --tune-preflight --prepared $WORK_DIR/prepared_case.json 退出码 0 并输出 TUNE_PREFLIGHT_OK，确认 Stage 7 待调优且上次交付已归档。"
      - "test -d $WORK_DIR/.cannbot/plugins/pypto-op-orchestrator/hooks 且 test -f $WORK_DIR/.opencode/plugins/pypto-state-transition.ts 且 test -d $WORK_DIR/.agents/skills/pypto-op-perf-tune"
    out_of_scope:
      - "任何调优与实现修改 (属 stage7-tune)"
      - "修改 <op>_impl.py / test_<op>.py / 既有 MEMORY.md 内容"
    depends_on: []
    executor: general-executor
    verifier: general-verifier
    max_retries: 1
    on_exhaust: exit

  - id: stage7-tune
    task_type: subgraph
    file: .workflow/pypto-stage7.yaml
    depends_on:
      - tune-preflight
