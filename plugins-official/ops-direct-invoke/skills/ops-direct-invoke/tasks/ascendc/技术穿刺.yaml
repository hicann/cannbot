variables:
  spike_scope: null
  executor_skills: 无补充 Skill。
  verifier_skills: 无补充 Skill。
task_type: normal
title: 技术穿刺
goal:
- 用最小可运行实现验证关键技术路线。
approach:
- 读取 $USER_PROMPT、$WORK_DIR/需求分析.md 和 $WORK_DIR/环境信息.md；必要输入缺失、失效或冲突时，停止依赖该输入的操作，在本阶段报告中记录阻塞证据，按 harness 原生协议结束执行。
- 必须加载 `repo-knowledge`、`repo-op-templates`、`repo-build-guide`、`repo-test-develop`、`repo-coding-rules` Skill，按其中的要求执行。
- '{{var:executor_skills}}'
- 穿刺范围：{{var:spike_scope}}。只验证下发路线及关键疑点；代表用例覆盖关键组合，不展开完整测试矩阵、白盒工程或交付文档。
- 复用目标仓已有工程和测试入口，编写最小实现及精度断言；临时实现、用例和构建文件放在 $WORK_DIR/{{id}}-穿刺/ 下，保留工程要求的文件名，明确授权的项目交付件按目标仓路径写入。将实现及测试入口实际文件路径赋给 spike_source、spike_test_entry，多文件逐一检查。
- 在目标芯片真实编译并运行代表用例，覆盖待验证的端到端关键组合；保持已确认接口、架构、精度与单 Kernel 等约束。只查到 API、各子步骤分别可用、CPU 自检或模拟执行不能代替设备证据。
- 按已安装的 ops-direct-invoke/templates/测试执行记录.md 写入 $WORK_DIR/{{id}}-测试执行记录.md，记录疑点、采用路线、代码/测试/构建产物版本、真实编译和设备原始日志、代表用例及结果、未验证范围和下一轮复用路径；不另写长篇方案。缺少设备、规则冲突或路线不可行时保存阻塞证据，停止受阻操作，不宣称穿刺成功。
procedure:
- 读取 $USER_PROMPT、$WORK_DIR/需求分析.md 和 $WORK_DIR/环境信息.md；必要输入缺失、失效或冲突时，记录阻塞证据并判定验收失败。
- 必须加载 `repo-coding-rules` Skill，按其中的要求执行。
- '{{var:verifier_skills}}'
- 穿刺范围：{{var:spike_scope}}。读取实现、测试入口及 $WORK_DIR/{{id}}-测试执行记录.md，给 spike_source、spike_test_entry 赋实际文件路径，逐一核对；静态检视关键组合、调用真实性及已确认约束，并检视本节点实现、测试和脚本代码的编码规范。
- 只读核对当前源码/测试/构建产物哈希、实际加载路径、目标设备、编译退出码及代表用例精度结果；不重新构建或运行。验收本次关键疑点是否有设备证据闭合，不要求未下发的全量覆盖或正式文档。
- 未验证关键组合、只有资料推导或 CPU/模拟证据、规则冲突未解时判失败；明确记录失败条件及未验证范围。通过仅证明穿刺范围可行，不证明完整算子已交付。
- 由 verifier 按已安装的 ops-direct-invoke/templates/验收报告.md 写入 $WORK_DIR/{{id}}-验收报告.md，执行 test -s "$WORK_DIR/{{id}}-验收报告.md"；通过、失败或阻塞均记录逐项结论与证据路径。重试仅追加问题处理和受影响项复核结果；当前版本缺少有效证据即失败，不补造或重跑测试。
acceptance:
- test -s "$spike_source"
- test -s "$spike_test_entry"
- test -s "$WORK_DIR/{{id}}-测试执行记录.md"
- 关键技术组合在目标芯片编译和运行成功，代表用例满足已确认的精度及架构约束。
- 实现、测试和脚本代码符合编码规则；证据对应当前版本，已验证范围、剩余风险及可复用路径明确。
out_of_scope:
- 改动已确认需求或放宽精度标准、以篡改 golden/用例掩盖失败、伪造确认或验证证据。
- 加载固定项及当前阶段下发清单以外的 Skill、向 PM 或用户发起交互、等待其答复、派发 Agent、修改 harness 或调度状态、重置或回退其他节点。
- 将中间产物写出 $WORK_DIR，或使用不以 {{id}}- 开头的中间报告名；算子交付件按目标仓约定路径写入。
- 性能采集与优化验收、回顾与经验总结、PR、外部 CI 或合并事务。
- executor 编写或修改验收者报告、为等待验收报告而停止交付；verifier 重新构建、安装或运行测试、替执行者补造执行证据。
- 把少量代表用例通过当作完整交付，展开与穿刺疑点无关的资料搜集或全量测试工程。
executor: ops-direct-invoke-developer
verifier: ops-direct-invoke-verifier
on_exhaust: exit
